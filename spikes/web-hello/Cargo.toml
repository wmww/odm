# Web-export renderer spike (plans/web-export.md phase 0): egui + odm-render
# on WebGPU in a real browser. Standalone: not a workspace member (root
# Cargo.toml excludes spikes/). No Manifold here — this half of phase 0 only
# tests fonts + the render pass structure, so plain wasm32 tooling suffices.
[package]
name = "web-hello-spike"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
odm-ir = { path = "../../crates/odm-ir" }
odm-render = { path = "../../crates/odm-render" }
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement"] }
console_error_panic_hook = "0.1"

[profile.release]
opt-level = "s"

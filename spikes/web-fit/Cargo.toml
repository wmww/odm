# Web-export fit spike (plans/web-export.md phase 0). Standalone: not a
# workspace member (root Cargo.toml excludes spikes/).
[package]
name = "web-fit-spike"
version = "0.1.0"
edition = "2024"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
odm-ir = { path = "../../crates/odm-ir" }
odm-store = { path = "../../crates/odm-store" }
odm-kernel = { path = "../../crates/odm-kernel", default-features = false, features = ["wasm-uu"] }
# Not used by the spike code; present to prove odm-build's other deps
# compile for wasm32-unknown-unknown.
jsonschema = { version = "0.49.2", default-features = false }
serde_json = "1"

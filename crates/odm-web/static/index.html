<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>ODM</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      overflow: hidden;
      background: #3c3c3c; /* theme::FACE */
    }
    #odm-canvas {
      width: 100%;
      height: 100%;
      display: block;
      outline: none;
    }
    #odm-status {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #ffffff;
      font: 14px sans-serif;
      pointer-events: none;
      white-space: pre-wrap;
      padding: 2em;
    }
  </style>
</head>
<body>
  <canvas id="odm-canvas"></canvas>
  <div id="odm-status">Loading ODM viewer…</div>
  <script src="./bundle.js"></script>
  <script type="module" src="./runtime.js"></script>
</body>
</html>

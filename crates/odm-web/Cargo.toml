# The web export's browser half (plans/web-export.md): the wasm module
# hosting the build engine + kernel + renderer + viewer core behind one
# page. Built ONLY by `cargo xtask build-web-template` for
# wasm32-unknown-unknown (the Manifold wasm-uu lane needs clang + wasm-ld +
# wasm-cxx-shim); on native targets the crate compiles to an empty stub so
# ordinary workspace builds never touch that toolchain.
[package]
name = "odm-web"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]
doctest = false
test = false

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
odm-kernel = { path = "../odm-kernel", default-features = false, features = ["wasm-uu"] }
odm-build = { path = "../odm-build", default-features = false }
odm-render = { path = "../odm-render" }
odm-viewer-core = { path = "../odm-viewer-core" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["Window", "Document", "HtmlCanvasElement", "console"] }
console_error_panic_hook = "0.1"

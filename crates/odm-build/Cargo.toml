[package]
name = "odm-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# unit tests live in src/meta.rs and src/version.rs
test = true

[features]
# Forward the kernel's parallel default so a wasm build (which needs
# odm-kernel with wasm-uu instead) can opt out: default-features = false.
default = ["parallel"]
parallel = ["odm-kernel/parallel"]
# Compiles in the test-only "test" API version (one deliberate surface
# difference) so the multi-version machinery stays exercised before v1
# exists. Enabled by dev-dependencies only; release builds reject the id.
test-api-version = []

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
odm-kernel = { path = "../odm-kernel", default-features = false }
odm-prompt = { path = "../odm-prompt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
jsonschema = { version = "0.49.2", default-features = false }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
# Tests exercise the multi-version machinery via the test-only API version.
odm-js = { path = "../odm-js", features = ["test-api-version"] }

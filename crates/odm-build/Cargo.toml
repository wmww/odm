[package]
name = "odm-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# no unit tests in src/; set true if you add #[cfg(test)] modules
test = false

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
odm-kernel = { path = "../odm-kernel" }
odm-js = { path = "../odm-js" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true

[dev-dependencies]
tempfile = "3"
# Tests exercise the multi-version machinery via the test-only API version.
odm-js = { path = "../odm-js", features = ["test-api-version"] }

[package]
name = "odm-build"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# unit tests live in src/meta.rs
test = true

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
odm-kernel = { path = "../odm-kernel" }
odm-js = { path = "../odm-js" }
odm-prompt = { path = "../odm-prompt" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror.workspace = true
jsonschema = { version = "0.49.2", default-features = false }
toml = "1.1.4"

[dev-dependencies]
tempfile = "3"
# Tests exercise the multi-version machinery via the test-only API version.
odm-js = { path = "../odm-js", features = ["test-api-version"] }

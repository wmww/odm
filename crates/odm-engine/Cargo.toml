[package]
name = "odm-engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# state.rs, commands.rs, requests.rs and agent/ have unit tests; flip to
# false if that ever stops being true.
test = true

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
odm-kernel = { path = "../odm-kernel" }
odm-js = { path = "../odm-js" }
odm-build = { path = "../odm-build" }
odm-export = { path = "../odm-export" }
odm-prompt = { path = "../odm-prompt" }
odm-config = { path = "../odm-config" }
odm-agent = { path = "../odm-agent" }
odm-render = { path = "../odm-render" }
odm-viewer-core = { path = "../odm-viewer-core" }
serde = { version = "1", features = ["derive"] }
eframe = { version = "=0.35.0", default-features = false, features = ["wgpu", "default_fonts", "x11", "wayland"] }
# Same pin eframe uses: the viewer drives its own winit event loop (see viewer.rs).
winit = { version = "=0.30.13", default-features = false, features = ["rwh_06"] }
notify = "=8.2.0"
serde_json = "1"
# Field paths in request shape errors ("rays[0].origin: invalid length…").
serde_path_to_error = "0.1"
# The feedback sink's one POST (rustls, no gzip: a form response is empty).
# Sync, and the send runs on its own thread anyway.
ureq = { version = "3", default-features = false, features = ["rustls"] }
anyhow.workspace = true
# The CLI's local socket (server.rs): abstract namespace / named pipe, no cfg.
interprocess = "2"
blake3.workspace = true

[dev-dependencies]
# The conformance runner stages single-file suite tests as temp projects.
tempfile = "3"

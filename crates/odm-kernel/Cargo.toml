[package]
name = "odm-kernel"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# unit tests live in src/dist.rs
test = true

[features]
# parallel is the native default; wasm-uu builds Manifold for
# wasm32-unknown-unknown via clang + wasm-cxx-shim (no emscripten).
# Use with default-features = false.
default = ["parallel"]
parallel = ["manifold-csg/parallel"]
wasm-uu = ["manifold-csg/unstable-wasm-uu"]

[dependencies]
odm-ir = { path = "../odm-ir" }
odm-store = { path = "../odm-store" }
manifold-csg = { version = "=0.3.3", default-features = false }
thiserror.workspace = true

[dev-dependencies]
# tests cross-check clearance against Manifold's own min_gap
manifold-csg = { version = "=0.3.3", default-features = false }

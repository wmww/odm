[package]
name = "odm-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# unit tests in src/lib.rs (poll --follow loop, response pretty-printer)
test = true

[dependencies]
odm-prompt = { path = "../odm-prompt" }
# canonical(): project paths without Windows' \\?\ prefix.
odm-config = { path = "../odm-config" }
serde_json = "1"
anyhow.workspace = true
# The engine's local socket (odm-engine's server.rs).
interprocess = "2"
# `odm docs` compiles the docs/ tree in (same idea as prompt.rs's include_str).
include_dir = "0.7"

[dev-dependencies]
odm-dylib = { path = "../odm-dylib" }  # thin test binaries: link the stack via one .so
tempfile = "3"

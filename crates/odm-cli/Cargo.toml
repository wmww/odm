[package]
name = "odm-cli"
version = "0.1.0"
edition.workspace = true
license.workspace = true

[lib]
doctest = false
# unit tests in src/lib.rs (the poll --follow loop)
test = true

[dependencies]
odm-prompt = { path = "../odm-prompt" }
serde_json = "1"
anyhow.workspace = true
# `odm docs` compiles the docs/ tree in (same idea as prompt.rs's include_str).
include_dir = "0.7"

[dev-dependencies]
tempfile = "3"

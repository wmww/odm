[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"

[profile.dev]
opt-level = 1
# Nobody here runs a debugger; line tables keep file:line in backtraces while
# dropping ~500 MB of DWARF per linked binary (~30 binaries with --all-targets).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

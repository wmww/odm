[workspace]
resolver = "3"
members = ["crates/*"]
# Not a member: cargo only passes -C prefer-dynamic (dynamic libstd) when a
# dylib is built as a dependency, not as a requested root. As a member,
# `cargo build --workspace` would build it with static libstd and every
# consumer would fail with "cannot satisfy dependencies so `std` only shows
# up once". It still builds as a path dep of odm and of the test binaries.
exclude = ["crates/odm-dylib"]

[workspace.package]
edition = "2024"
license = "MIT"

[workspace.dependencies]
blake3 = "1"
anyhow = "1"
thiserror = "2"
libc = "0.2"

[profile.dev]
opt-level = 1
# Nobody here runs a debugger; line tables keep file:line in backtraces while
# dropping ~500 MB of DWARF per linked binary (~30 binaries with --all-targets).
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2
